<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Invites — UGC Platform for Collaborators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens and scale — identical to the brand web app (main branch).
     ===================================================================== */
  :root{
    --grey-50:#fff; --grey-50-90:rgba(255,255,255,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* desktop layout */
    --gutter:24px; --page:1128px; --header:52px; --shell:1128px;
    /* invite card surfaces */
    --inv-tag:#e1e7fb; --inv-desc:#f5f5f5;
    /* availability */
    --green-100:#dcf5e6; --green-500:#12a150; --green-700:#0b6b35;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* Reserve the scrollbar space on every page so short and long pages line up */
  html{scrollbar-gutter:stable;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the brand and creator apps */
  @keyframes screenIn{from{opacity:0;transform:translateY(17px) scale(.988);filter:blur(5px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--shell)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:32px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:18px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  /* Hamburger + its menu are phone-only (same pattern as the creator web app); desktop keeps the logo and icon nav */
  .menu-btn{display:none;grid-column:1;justify-self:start;width:40px;height:40px;margin-left:-8px;border-radius:100px;align-items:center;justify-content:center;color:var(--grey-800);transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .menu-btn svg{width:24px;height:24px;}
  .menu-btn:hover{background:var(--grey-100);}
  .menu-btn:active{transform:scale(.94);}
  .menu-btn.on{background:var(--grey-800);color:var(--grey-50);}
  .drawer,.drawer-scrim{display:none;}
  .menu-list{display:flex;flex-direction:column;gap:4px;}
  .set-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;cursor:pointer;}
  .set-row:hover{background:var(--grey-100);}
  .menu-list .set-row.active{background:var(--grey-100);}
  .set-ic{position:relative;width:22px;height:22px;color:var(--grey-700);flex-shrink:0;display:flex;}
  .set-ic svg{width:22px;height:22px;}
  .set-lbl{flex:1;font-size:14px;font-weight:500;line-height:18px;color:var(--grey-800);}
  .set-chev{width:20px;height:20px;color:var(--grey-500);flex-shrink:0;display:flex;}
  .set-chev svg{width:20px;height:20px;}
  .set-ic .ndot{position:absolute;top:-1px;right:-2px;width:8px;height:8px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .tnav{grid-column:2;display:flex;align-items:center;gap:4px;}
  .tnav a{width:52px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{width:20px;height:20px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .tnav a{position:relative;}
  .tnav .ndot{position:absolute;top:5px;right:13px;width:7px;height:7px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px;}
  .hicon{width:32px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:17px;height:17px;}
  .hicon .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:32px;height:32px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:18px var(--gutter) 60px;}

  /* ================= Shared components ================= */
  .tag{flex-shrink:0;padding:6px 9px;border-radius:75px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}

  /* Placeholder / empty state */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:9px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:5px 9px;border-radius:75px;}
  .ph h2{font-size:20px;font-weight:600;color:var(--grey-800);line-height:27px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:260px;}

  /* Skeleton while the invites load */
  .sk{background:var(--grey-100);border-radius:9px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-inv{display:flex;flex-direction:column;gap:12px;padding:21px;border:1px solid var(--grey-200);border-radius:24px;}
  .sk-inv .row{display:flex;gap:12px;align-items:center;}
  .sk-inv .logo{width:48px;height:48px;border-radius:100px;flex-shrink:0;}
  .sk-inv .l1{height:16px;width:60%;}
  .sk-inv .l2{height:12px;width:40%;margin-top:6px;}
  .sk-inv .tags{height:22px;width:55%;border-radius:75px;}
  .sk-inv .desc{height:96px;border-radius:12px;}
  .sk-inv .cta{height:48px;border-radius:100px;}

  /* ================= Page heading ================= */
  .home{padding-top:6px;}
  .home-title{font-size:24px;font-weight:600;line-height:30px;letter-spacing:-.02em;color:#000;}
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:12px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:9px;height:36px;margin:1px;padding:0 15px;border:1px solid var(--grey-400);border-radius:75px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:3px 6px;border-radius:6px;background:var(--grey-100);}

  /* ================= Invite card =================
     A white card resting on a dark base; the base peeks out below with the closing time. */
  .invgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px;align-items:start;}
  .inv{background:var(--grey-800);border-radius:27px;display:flex;flex-direction:column;
    transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1),opacity .3s ease;animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .inv:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.08);}
  .inv.leaving{opacity:0;transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.inv{animation:none;}}
  .inv-card{background:#fff;border:1px solid var(--grey-200);border-radius:27px;padding:21px 18px 18px;display:flex;flex-direction:column;gap:15px;}
  .inv-head{display:flex;align-items:center;gap:12px;}
  .inv-logo{width:48px;height:48px;border-radius:100px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .inv-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .inv-name{font-size:16px;font-weight:600;line-height:20px;color:var(--grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-meta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;line-height:16px;color:var(--grey-600);white-space:nowrap;}
  .inv-meta{overflow:hidden;}
  .inv-meta span:last-child{overflow:hidden;text-overflow:ellipsis;}
  .inv-meta .dot{width:3px;height:3px;border-radius:9px;background:var(--grey-600);flex-shrink:0;}
  .inv-start{flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:3px;}
  .inv-start .k{font-size:12px;font-weight:400;line-height:16px;color:var(--grey-600);}
  .inv-start .v{font-size:16px;font-weight:600;line-height:20px;color:var(--grey-800);white-space:nowrap;}
  .inv-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .inv-tag{padding:6px 10px;border-radius:75px;background:var(--inv-tag);font-size:12px;font-weight:400;line-height:12px;color:var(--grey-800);white-space:nowrap;}
  .inv-desc{background:var(--inv-desc);border-radius:12px;padding:15px;font-size:14px;line-height:20px;color:var(--grey-800);min-height:110px;}
  .inv-actions{display:flex;align-items:center;gap:12px;}
  .inv-x{width:48px;height:48px;border-radius:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--grey-200);color:var(--grey-800);transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .inv-x svg{width:18px;height:18px;}
  .inv-x:hover{background:var(--grey-400);}
  .inv-x:active{transform:scale(.94);}
  .inv-cta{flex:1;height:48px;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--blue-500);font-size:15px;font-weight:500;line-height:20px;color:#fff;box-shadow:2px 4px 9px rgba(21,72,235,.2);transition:background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .inv-cta:hover{background:var(--blue-600);}
  .inv-cta:active{transform:scale(.98);}
  .inv-x:disabled,.inv-cta:disabled{opacity:.4;cursor:default;transform:none;}
  .inv-foot{padding:9px 18px 11px;text-align:center;font-size:13px;font-weight:400;line-height:18px;color:#fff;}
  .inv-foot.soon{color:#ff8fd2;}
  .inv-foot.done{color:var(--grey-500);}

  /* ================= Chats =================
     Conversation list on the left, the open chat on the right; one pane at a time on phones. */
  body.chat-page .content{padding-bottom:18px;}
  /* Heading and search sit above the bordered box, like the Invites heading */
  .chat-page-wrap{display:flex;flex-direction:column;height:calc(100dvh - var(--header) - 36px);min-height:520px;padding-top:6px;}
  /* Two separate columns: the chat list, and the open chat in its own bordered box filling the height */
  .chats{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;}
  .cl{display:flex;flex-direction:column;min-height:0;}
  /* The heading sits in the list column, so the open chat can use the full height */
  .cl-head{display:flex;flex-direction:column;gap:18px;padding:0 0 6px;}
  .cl-list{flex:1;min-height:0;overflow-y:auto;padding:0;display:flex;flex-direction:column;}
  /* Chats separated by lines */
  .cl-item{position:relative;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;transition:background .2s ease;}
  .cl-item::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--grey-200);}
  .cl-item:last-child::after,.cl-item:hover::after,.cl-item.active::after,.cl-item:has(+.cl-item:hover)::after,.cl-item:has(+.cl-item.active)::after{background:transparent;}
  .cl-item:hover{background:var(--grey-100);}
  .cl-item.active{background:var(--blue-100);}
  .cl-logo{width:40px;height:40px;border-radius:100px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .cl-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .cl-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .cl-name{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cl-time{font-size:12px;line-height:16px;color:var(--grey-600);white-space:nowrap;flex-shrink:0;}
  .cl-bottom{display:flex;align-items:center;gap:8px;}
  .cl-last{flex:1;min-width:0;font-size:13px;line-height:18px;color:var(--grey-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cl-item.unread .cl-last{color:var(--grey-800);font-weight:500;}
  .cl-item.unread .cl-time{color:var(--blue-500);font-weight:500;}
  .cl-unread{width:8px;height:8px;border-radius:100px;background:var(--blue-500);flex-shrink:0;}

  .cv{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--grey-200);border-radius:24px;overflow:hidden;background:#fff;}
  .cv-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--grey-200);}
  .cv-back{display:none;width:32px;height:32px;border-radius:100px;align-items:center;justify-content:center;margin-left:-6px;color:var(--grey-800);flex-shrink:0;transition:background .2s ease;}
  .cv-back:hover{background:var(--grey-100);}
  .cv-back svg{width:20px;height:20px;}
  .cv-logo{width:36px;height:36px;border-radius:100px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .cv-who{flex:1;min-width:0;display:flex;flex-direction:column;}
  .cv-name{font-size:15px;font-weight:600;line-height:20px;color:var(--grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cv-meta{font-size:12px;line-height:16px;color:var(--grey-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cv-meta.typing{color:var(--blue-500);}
  .cv-msgs{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:4px;}
  /* The invite the chat came from, pinned at the top of the conversation */
  .cv-invite{align-self:center;width:100%;max-width:420px;margin-bottom:12px;padding:15px;border:1px solid var(--grey-200);border-radius:18px;display:flex;flex-direction:column;gap:10px;}
  .cv-invite .k{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);display:flex;justify-content:space-between;gap:8px;}
  .cv-invite .k b{font-weight:600;color:var(--grey-800);}
  .cv-invite .inv-desc{min-height:0;padding:12px;font-size:13px;line-height:18px;}
  .cv-day{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .cv-sys{align-self:center;margin:2px 0 8px;padding:6px 10px;border-radius:75px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);text-align:center;}
  .msg{max-width:min(72%,460px);padding:9px 13px;border-radius:18px;font-size:14px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:msgIn .3s cubic-bezier(.16,1,.3,1) both;}
  .msg.them{align-self:flex-start;background:var(--grey-100);color:var(--grey-800);border-bottom-left-radius:6px;}
  .msg.me{align-self:flex-end;background:var(--blue-500);color:#fff;border-bottom-right-radius:6px;}
  .msg.cont.them{border-top-left-radius:6px;}
  .msg.cont.me{border-top-right-radius:6px;}
  .msg-time{font-size:11px;line-height:14px;color:var(--grey-500);margin:2px 4px 8px;}
  .msg-time.me{align-self:flex-end;}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .msg.typing{display:flex;gap:4px;align-items:center;padding:13px 14px;}
  .msg.typing i{width:6px;height:6px;border-radius:100px;background:var(--grey-500);animation:blink 1.2s infinite both;}
  .msg.typing i:nth-child(2){animation-delay:.15s;}
  .msg.typing i:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:none;}30%{opacity:1;transform:translateY(-2px);}}
  @media(prefers-reduced-motion:reduce){.msg,.msg.typing i{animation:none;}}
  /* A file sent in the chat */
  .msg.file{display:flex;align-items:center;gap:10px;width:min(72%,300px);padding:8px 12px 8px 8px;cursor:pointer;transition:background .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .msg.file.them:hover{background:var(--grey-200);}
  .msg.file:active{transform:scale(.98);}
  .file-ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--blue-700);font-size:10px;font-weight:600;letter-spacing:.02em;}
  .file-ic.zip{color:var(--grey-700);}
  .file-ic.xlsx{color:#1c6b3c;}
  .file-name{flex:1;min-width:0;display:flex;flex-direction:column;}
  .file-name b{font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-name span{font-size:12px;line-height:16px;color:var(--grey-600);}
  .file-dl{width:18px;height:18px;color:var(--grey-600);flex-shrink:0;}
  .cv-compose{display:flex;align-items:flex-end;gap:9px;padding:12px 18px 15px;border-top:1px solid var(--grey-200);}
  .cv-input{flex:1;min-width:0;display:flex;padding:7px 15px;border:1px solid var(--grey-400);border-radius:20px;background:#fff;transition:border-color .2s ease;}
  .cv-input:focus-within{border-color:var(--blue-300);}
  .cv-input textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;font:400 14px/20px var(--font);color:var(--grey-800);max-height:120px;}
  .cv-input textarea::placeholder{color:var(--grey-600);}
  .cv-send{width:36px;height:36px;border-radius:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--blue-500);color:#fff;transition:background .25s ease,opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .cv-send svg{width:18px;height:18px;}
  .cv-send:hover{background:var(--blue-600);}
  .cv-send:active{transform:scale(.94);}
  .cv-send:disabled{opacity:.35;cursor:default;transform:none;background:var(--blue-500);}
  .cv-empty{flex:1;display:flex;align-items:center;justify-content:center;}

  /* ================= Notifications popover ================= */
  .pop{position:fixed;top:calc(var(--header) + 8px);right:var(--gutter);width:300px;max-height:min(420px,calc(100dvh - var(--header) - 16px));z-index:40;display:flex;flex-direction:column;
    background:var(--grey-50);border-radius:21px;box-shadow:0 12px 30px rgba(0,0,0,.18);border:1px solid var(--grey-200);
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);}
  .pop.open{opacity:1;transform:none;pointer-events:auto;}
  .nt-title{padding:18px 18px 0;font-size:18px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .nt-list{display:flex;flex-direction:column;gap:12px;padding:15px 12px 18px;overflow-y:auto;}
  .nt-item{display:flex;gap:9px;align-items:flex-start;}
  .nt-item[data-go]{cursor:pointer;}
  .nt-logo{width:24px;height:24px;border-radius:15px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .nt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--grey-200);}
  .nt-item:last-child .nt-body{border-bottom:none;padding-bottom:0;}
  .nt-text{font-size:14px;line-height:20px;color:var(--grey-800);font-weight:600;}
  .nt-text .med{font-weight:500;}
  .nt-time{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}

  .toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--grey-800);color:var(--grey-50);display:flex;align-items:center;gap:12px;
    padding:9px 15px;border-radius:75px;font-size:14px;font-weight:500;box-shadow:2px 2px 9px rgba(0,0,0,.16);transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast button{font-weight:600;color:var(--blue-200);}

  /* ================= Profile =================
     Hero card (cover, avatar, headline, stats), sticky tabs, then Overview / Portfolio / Experience / Reviews. */
  .top-link.active .top-av{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--grey-800);}
  .pf{padding-top:6px;}
  .pf-hero{border:1px solid var(--grey-200);border-radius:27px;overflow:hidden;background:#fff;}
  .pf-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:24px;}
  .pf-av{width:104px;height:104px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);background:var(--grey-100);}
  .pf-id{min-width:0;display:flex;flex-direction:column;gap:6px;}
  .pf-name{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:600;line-height:30px;letter-spacing:-.02em;color:#000;}
  .pf-name svg{width:20px;height:20px;color:var(--blue-500);flex-shrink:0;}
  .pf-headline{font-size:15px;font-weight:500;line-height:20px;color:var(--grey-700);}
  .pf-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 15px;font-size:13px;line-height:18px;color:var(--grey-600);}
  .pf-meta span{display:flex;align-items:center;gap:5px;}
  .pf-meta svg{width:15px;height:15px;flex-shrink:0;}
  .pf-actions{display:flex;gap:9px;}
  .btn{height:40px;padding:0 16px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;border:1px solid var(--grey-200);background:#fff;color:var(--grey-800);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .btn svg{width:17px;height:17px;flex-shrink:0;}
  .btn:hover{background:var(--grey-100);}
  .btn:active{transform:scale(.97);}
  .btn.dark{background:var(--grey-800);border-color:var(--grey-800);color:#fff;}
  .btn.dark:hover{background:var(--grey-700);}
  .btn.blue{background:var(--blue-500);border-color:var(--blue-500);color:#fff;box-shadow:2px 4px 9px rgba(21,72,235,.2);}
  .btn.blue:hover{background:var(--blue-600);}
  .btn.sm{height:32px;padding:0 12px;font-size:13px;}
  .avail{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:75px;background:var(--green-100);color:var(--green-700);font-size:12px;font-weight:600;line-height:14px;align-self:flex-start;}
  .avail i{width:7px;height:7px;border-radius:100px;background:var(--green-500);box-shadow:0 0 0 3px rgba(18,161,80,.18);}
  .avail.off{background:var(--grey-100);color:var(--grey-600);}
  .avail.off i{background:var(--grey-500);box-shadow:none;}
  .pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--grey-200);}
  .pf-stat{padding:15px 24px;display:flex;flex-direction:column;gap:2px;}
  .pf-stat+.pf-stat{border-left:1px solid var(--grey-200);}
  .pf-stat b{font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.01em;color:var(--grey-800);}
  .pf-stat span{font-size:12px;line-height:16px;color:var(--grey-600);}

  .pf-tabs{position:sticky;top:var(--header);z-index:10;display:flex;gap:4px;margin-top:12px;padding-top:6px;background:var(--grey-50);border-bottom:1px solid var(--grey-200);overflow-x:auto;scrollbar-width:none;}
  .pf-tabs::-webkit-scrollbar{display:none;}
  .pf-tab{position:relative;display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);white-space:nowrap;transition:color .2s ease;}
  .pf-tab:hover{color:var(--grey-800);}
  .pf-tab .n{padding:2px 6px;border-radius:75px;background:var(--grey-100);font-size:11px;font-weight:600;line-height:12px;color:var(--grey-600);}
  .pf-tab.active{color:var(--grey-800);}
  .pf-tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--grey-800);}
  .pf-panel{padding-top:24px;animation:cardIn .45s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.pf-panel{animation:none;}}

  .pf-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;}
  .pf-col{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .pf-card{border:1px solid var(--grey-200);border-radius:24px;padding:21px;display:flex;flex-direction:column;gap:15px;background:#fff;}
  .pf-h{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .pf-h .more{font-size:13px;font-weight:500;color:var(--blue-500);}
  .pf-h .more:hover{color:var(--blue-700);}
  .pf-sub{font-size:13px;line-height:18px;color:var(--grey-600);margin-top:-9px;}
  .pf-about{font-size:14px;line-height:22px;color:var(--grey-700);white-space:pre-line;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:7px 11px;border-radius:75px;background:var(--grey-100);font-size:13px;font-weight:500;line-height:14px;color:var(--grey-800);white-space:nowrap;}
  .chip.blue{background:var(--inv-tag);}
  .kv{display:flex;flex-direction:column;gap:6px;}
  .kv-k{font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);}

  /* Services and rates */
  .svc{display:flex;flex-direction:column;}
  .svc-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--grey-200);}
  .svc-row:first-child{border-top:0;padding-top:0;}
  .svc-row:last-child{padding-bottom:0;}
  .svc-ic{width:40px;height:40px;border-radius:12px;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;}
  .svc-ic svg{width:20px;height:20px;}
  .svc-name{font-size:14px;font-weight:600;line-height:20px;}
  .svc-desc{font-size:13px;line-height:18px;color:var(--grey-600);}
  .svc-price{text-align:right;font-size:14px;font-weight:600;line-height:20px;white-space:nowrap;}
  .svc-price span{display:block;font-size:12px;font-weight:400;line-height:16px;color:var(--grey-600);}

  /* Sidebar */
  .av-card{background:var(--grey-800);color:#fff;border-color:var(--grey-800);}
  .av-card .pf-h{color:#fff;}
  .av-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .av-row p{font-size:13px;line-height:18px;color:var(--grey-400);}
  .av-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:15px;border-top:1px solid rgba(255,255,255,.14);}
  .av-facts span{display:block;font-size:12px;line-height:16px;color:var(--grey-500);}
  .av-facts b{font-size:14px;font-weight:600;line-height:20px;}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;}
  .switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1;}
  .switch i{position:absolute;inset:0;border-radius:100px;background:var(--grey-600);transition:background .25s ease;}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:100px;background:#fff;transition:transform .3s cubic-bezier(.16,1,.3,1);}
  .switch input:checked+i{background:var(--green-500);}
  .switch input:checked+i::after{transform:translateX(18px);}
  .switch input:focus-visible+i{outline:2px solid var(--blue-300);outline-offset:2px;}
  .meter{height:8px;border-radius:100px;background:var(--grey-100);overflow:hidden;}
  .meter i{display:block;height:100%;border-radius:100px;background:var(--blue-500);transition:width .6s cubic-bezier(.16,1,.3,1);}
  .checks{display:flex;flex-direction:column;gap:9px;}
  .check{display:flex;align-items:center;gap:9px;font-size:13px;line-height:18px;color:var(--grey-700);}
  .check .ck{width:20px;height:20px;border-radius:100px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--green-100);color:var(--green-700);}
  .check .ck svg{width:12px;height:12px;}
  .check.todo .ck{background:var(--grey-100);color:var(--grey-500);}
  .check.todo{color:var(--grey-800);font-weight:500;}
  .check.todo a{margin-left:auto;font-size:12px;font-weight:600;color:var(--blue-500);}
  .plat{display:grid;grid-template-columns:32px minmax(0,1fr) 40px;gap:10px;align-items:center;}
  .plat-ic{width:32px;height:32px;border-radius:10px;background:var(--grey-800);color:#fff;display:flex;align-items:center;justify-content:center;}
  .plat-ic svg{width:17px;height:17px;}
  .plat-name{font-size:14px;font-weight:500;line-height:18px;display:flex;flex-direction:column;gap:5px;}
  .plat-bar{height:5px;border-radius:100px;background:var(--grey-100);overflow:hidden;}
  .plat-bar i{display:block;height:100%;background:var(--grey-800);border-radius:100px;}
  .plat-pct{text-align:right;font-size:13px;font-weight:600;color:var(--grey-700);}
  .clients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;}
  .client{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:15px;color:var(--grey-700);}
  .client img{width:44px;height:44px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);background:var(--grey-100);}
  .links{display:flex;flex-direction:column;gap:4px;}
  .lnk{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:0 -10px;border-radius:12px;font-size:14px;font-weight:500;line-height:18px;transition:background .2s ease;}
  .lnk:hover{background:var(--grey-100);}
  .lnk svg{width:18px;height:18px;flex-shrink:0;color:var(--grey-700);}
  .lnk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lnk .ext{flex:0 0 15px;width:15px;height:15px;color:var(--grey-500);}

  /* Portfolio: work cards styled like the social posts they were */
  .pw-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .fchips{display:flex;gap:6px;flex-wrap:wrap;}
  .fchip{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:75px;border:1px solid var(--grey-200);font-size:13px;font-weight:500;color:var(--grey-700);transition:background .2s ease,color .2s ease,border-color .2s ease;}
  .fchip svg{width:15px;height:15px;}
  .fchip:hover{background:var(--grey-100);}
  .fchip.on{background:var(--grey-800);border-color:var(--grey-800);color:#fff;}
  .pwgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px;margin-top:18px;}
  .pf-col .pwgrid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0;}
  .pw{display:flex;flex-direction:column;gap:10px;text-align:left;animation:cardIn .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 50ms);}
  @media(prefers-reduced-motion:reduce){.pw{animation:none;}}
  .pw-cover{position:relative;aspect-ratio:4/5;border-radius:21px;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
    background:linear-gradient(155deg,var(--c1),var(--c2));transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);}
  .pw-cover::before{content:"";position:absolute;width:75%;aspect-ratio:1;right:-25%;bottom:-18%;border-radius:50%;background:rgba(255,255,255,.12);}
  .pw-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.35));}
  .pw:hover .pw-cover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.14);}
  .pw:active .pw-cover{transform:scale(.98);}
  .pw-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pw-plat{display:flex;align-items:center;gap:5px;padding:5px 9px 5px 7px;border-radius:75px;background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11px;font-weight:600;line-height:12px;}
  .pw-plat svg{width:13px;height:13px;}
  .pw-play{width:30px;height:30px;border-radius:100px;background:rgba(255,255,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;}
  .pw-play svg{width:13px;height:13px;margin-left:2px;}
  .pw-hook{position:relative;z-index:1;font-size:19px;font-weight:600;line-height:23px;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance;}
  .pw-kpi{position:relative;z-index:1;display:flex;gap:12px;font-size:12px;line-height:14px;}
  .pw-kpi b{display:block;font-size:15px;font-weight:600;line-height:18px;}
  .pw-kpi span{opacity:.8;}
  .pw-title{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);padding:0 2px;}
  .pw-meta{font-size:12px;line-height:16px;color:var(--grey-600);padding:0 2px;margin-top:-8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Experience timeline */
  .xp{display:flex;flex-direction:column;}
  .xp-item{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:15px;padding-bottom:24px;}
  .xp-item:last-child{padding-bottom:0;}
  .xp-item:not(:last-child)::before{content:"";position:absolute;left:23.5px;top:54px;bottom:6px;width:1px;background:var(--grey-200);}
  .xp-logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;background:var(--grey-800);}
  .xp-logo.blue{background:var(--blue-500);}
  .xp-logo.pink{background:var(--pink-500);}
  .xp-body{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .xp-role{font-size:16px;font-weight:600;line-height:22px;}
  .xp-org{font-size:14px;line-height:20px;color:var(--grey-700);}
  .xp-when{font-size:13px;line-height:18px;color:var(--grey-600);}
  .xp-desc{font-size:14px;line-height:21px;color:var(--grey-700);margin-top:3px;}
  .xp-hl{display:flex;flex-direction:column;gap:5px;padding-left:18px;font-size:14px;line-height:20px;color:var(--grey-800);}
  .xp-hl li::marker{color:var(--blue-500);}
  .cert{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;}
  .cert+.cert{padding-top:12px;border-top:1px solid var(--grey-200);}
  .cert-ic{width:40px;height:40px;border-radius:12px;background:var(--inv-tag);color:var(--blue-700);display:flex;align-items:center;justify-content:center;}
  .cert-ic svg{width:20px;height:20px;}
  .cert b{display:block;font-size:14px;font-weight:600;line-height:20px;}
  .cert span{font-size:13px;line-height:18px;color:var(--grey-600);}

  /* ================= Modal (case study, edit profile, add work) ================= */
  .modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal-wrap[hidden]{display:none;}
  .modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s ease;}
  .modal{position:relative;width:min(720px,100%);max-height:calc(100dvh - 48px);overflow-y:auto;background:#fff;border-radius:27px;box-shadow:0 24px 60px rgba(0,0,0,.25);
    opacity:0;transform:translateY(14px) scale(.98);transition:opacity .25s ease,transform .4s cubic-bezier(.16,1,.3,1);}
  .modal.narrow{width:min(560px,100%);}
  .modal-wrap.open .modal-scrim{opacity:1;}
  .modal-wrap.open .modal{opacity:1;transform:none;}
  body.modal-open{overflow:hidden;}
  .modal-x{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:100px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:var(--grey-800);border:1px solid var(--grey-200);transition:background .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .modal-x:hover{background:var(--grey-100);}
  .modal-x:active{transform:scale(.94);}
  .modal-x svg{width:16px;height:16px;}
  .cs-cover{position:relative;min-height:200px;padding:24px 24px 21px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));overflow:hidden;}
  .cs-cover::before{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-120px;border-radius:50%;background:rgba(255,255,255,.12);}
  .cs-cover .pw-plat{align-self:flex-start;position:relative;}
  .cs-hook{position:relative;font-size:26px;font-weight:600;line-height:32px;letter-spacing:-.02em;max-width:520px;text-wrap:balance;}
  .cs-body{padding:21px 24px 24px;display:flex;flex-direction:column;gap:21px;}
  .cs-title{font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.01em;}
  .cs-meta{font-size:13px;line-height:18px;color:var(--grey-600);margin-top:3px;}
  .cs-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .cs-kpi{padding:13px 15px;border-radius:15px;background:var(--inv-desc);}
  .cs-kpi b{display:block;font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.01em;}
  .cs-kpi span{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cs-sec{display:flex;flex-direction:column;gap:6px;}
  .cs-sec h3{font-size:12px;font-weight:600;line-height:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--grey-600);}
  .cs-sec p{font-size:14px;line-height:22px;color:var(--grey-800);}
  .cs-sec ul{display:flex;flex-direction:column;gap:5px;padding-left:18px;font-size:14px;line-height:21px;}
  .cs-sec li::marker{color:var(--blue-500);}
  .cs-foot{display:flex;gap:9px;justify-content:flex-end;padding-top:6px;}

  .form{padding:24px;display:flex;flex-direction:column;gap:15px;}
  .form h2{font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.01em;padding-right:40px;}
  .form .pf-sub{margin-top:-9px;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .field>span{font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);}
  .field input,.field textarea,.field select{width:100%;min-width:0;padding:9px 13px;border:1px solid var(--grey-400);border-radius:12px;background:#fff;font:400 14px/20px var(--font);color:var(--grey-800);outline:0;transition:border-color .2s ease;}
  .field textarea{resize:vertical;min-height:96px;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue-300);}
  .field input::placeholder,.field textarea::placeholder{color:var(--grey-500);}
  .form-foot{display:flex;justify-content:flex-end;gap:9px;padding-top:6px;}

  @media (max-width:1023px){
    :root{--gutter:18px;}
    .invgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pf-grid{grid-template-columns:minmax(0,1fr);}
    .pwgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (max-width:767px){
    :root{--gutter:12px;}
    .topbar{gap:6px;}

function fallback(img){
  const label=(img.dataset.label||"?").slice(0,2).toUpperCase();
  const c=['#1548eb','#f433ab','#717171','#121212'][label.charCodeAt(0)%4];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='${c}'/><text x='50%' y='54%' font-family='Inter,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle' dominant-baseline='middle'>${label}</text></svg>`;
  img.src='data:image/svg+xml;base64,'+btoa(svg);
}
function bindAssets(root){
  root.querySelectorAll('img[data-a]').forEach(img=>{
    if(img.dataset.bound) return; img.dataset.bound=1;
    img.onerror=()=>{img.onerror=null;fallback(img);};
    if(A[img.dataset.a]) img.src=A[img.dataset.a]; else fallback(img);
  });
}

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function closesIn(v){
  const left=v.closes-Date.now();
  if(left<=0) return {text:'Closed',cls:'done'};
  const d=Math.floor(left/(24*H)),h=Math.floor(left%(24*H)/H),m=Math.floor(left%H/M);
  const text=d?`Closes in ${d} d ${h} h`:h?`Closes in ${h} h ${m} min`:`Closes in ${Math.max(m,1)} min`;
  return {text,cls:left<H?'soon':''};
}

const pad=n=>String(n).padStart(2,'0');
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function clock(ts){const d=new Date(ts),h=d.getHours();return `${h%12||12}:${pad(d.getMinutes())} ${h<12?'am':'pm'}`;}
function dayLabel(ts){
  if(sameDay(ts,Date.now())) return 'Today';
  if(sameDay(ts,Date.now()-24*H)) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function listTime(ts){
  if(Date.now()-ts<M) return 'now';
  if(sameDay(ts,Date.now())) return clock(ts);
  if(sameDay(ts,Date.now()-24*H)) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const lastMsg=id=>CHATS[id].msgs[CHATS[id].msgs.length-1];
const preview=m=>m.kind==='file'?m.name:m.text.replace(/\n/g,' ');
const ext=n=>n.split('.').pop().toLowerCase();
function bodyHTML(m){
  if(m.kind==='file') return `<span class="file-ic ${ext(m.name)}">${ext(m.name).toUpperCase()}</span><span class="file-name"><b>${esc(m.name)}</b><span>${m.size} · ${ext(m.name).toUpperCase()}</span></span><span class="file-dl">${ICON.download}</span>`;

}

function renderThread(){
  const box=document.getElementById('cv-msgs'),id=state.chat; if(!box||!id) return;
  const v=byId(id),c=CHATS[id];
  let html=`<div class="cv-invite"><div class="k"><span>Invite · ${esc(v.industry)}</span><span>Start date <b>${v.start}</b></span></div>
    <div class="inv-tags">${v.tags.map(t=>`<span class="inv-tag">${esc(t)}</span>`).join('')}</div><p class="inv-desc">${esc(v.desc)}</p></div>`;
  c.msgs.forEach((m,i)=>{
    const p=c.msgs[i-1],n=c.msgs[i+1];
    if(!p||!sameDay(p.ts,m.ts)) html+=`<div class="cv-day">${dayLabel(m.ts)}</div>`;
    if(m.from==='sys'){html+=`<div class="cv-sys">${esc(m.text)}</div>`;return;}
    const cont=p&&p.from===m.from&&m.ts-p.ts<5*M;
    const end=!n||n.from!==m.from||n.ts-m.ts>=5*M;
    const file=m.kind==='file';
    const tag=file?`a href="#" data-file="${esc(m.name)}" aria-label="Download ${esc(m.name)}"`:'div';
    html+=`<${tag} class="msg ${m.from}${cont?' cont':''}${file?' file':''}"${m.fresh?'':' style="animation:none"'}>${bodyHTML(m)}</${file?'a':'div'}>`;
    if(end) html+=`<div class="msg-time ${m.from}">${clock(m.ts)}</div>`;
    delete m.fresh;
  });
  if(typing[id]) html+=`<div class="msg them typing" aria-label="${esc(v.brand)} is typing"><i></i><i></i><i></i></div>`;
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
  const meta=document.getElementById('cv-meta');
  meta.textContent=typing[id]?'Typing…':`${v.industry} · Starts ${v.start}`;
  meta.classList.toggle('typing',!!typing[id]);
}

function startChat(id){
  const v=byId(id); if(!v) return;
  v.status='chatting';
  if(!CHATS[id]){
    CHATS[id]={unread:false,answered:false,msgs:[{from:'sys',text:'You started a chat about this invite',ts:Date.now()}]};
    brandSequence(id,openingMsgs(v));
  }
  location.hash='#/chats/'+id;
}
/* The brand "types" each message in turn; longer messages take a little longer */
function brandSequence(id,msgs){
  let t=500;
  CHATS[id].busy=true;
  msgs.forEach((m,i)=>{
    setTimeout(()=>{typing[id]=true;refreshChats();},t);
    t+=Math.min(1700,700+(m.text||'').length*6);
    setTimeout(()=>{
      typing[id]=i<msgs.length-1;
      CHATS[id].msgs.push({...m,ts:Date.now(),fresh:true});
      if(i===msgs.length-1){CHATS[id].busy=false;if(CHATS[id].pending){CHATS[id].pending=false;autoReply(id);}}
      if(!(state.page==='chats'&&state.chat===id&&!document.hidden)) CHATS[id].unread=true;
      refreshChats();
    },t);
    t+=250;
  });
}
function autoReply(id){
  const c=CHATS[id];
  if(c.busy){c.pending=true;return;}
  if(typing[id]) return;
  if(!c.answered){c.answered=true;return brandReply(id,COMMISSION_REPLY,2400);}
  brandReply(id,REPLIES[replyN++%REPLIES.length],2600);
}
function brandReply(id,text,delay){
  setTimeout(()=>{typing[id]=true;refreshChats();},Math.min(700,delay/2));
  setTimeout(()=>{
    typing[id]=false;
    CHATS[id].msgs.push({from:'them',text,ts:Date.now(),fresh:true});
    if(!(state.page==='chats'&&state.chat===id&&!document.hidden)) CHATS[id].unread=true;
    refreshChats();
  },delay);
}
function sendMsg(){
  const ta=document.getElementById('cv-text'),id=state.chat; if(!ta||!id) return;
  const text=ta.value.trim(); if(!text) return;
  CHATS[id].msgs.push({from:'me',text,ts:Date.now(),fresh:true});
  ta.value='';autosize(ta);
  refreshChats();
  autoReply(id);
}
function autosize(ta){
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  document.getElementById('cv-send').disabled=!ta.value.trim();
}

const modal=document.getElementById('modal'),modalBox=document.getElementById('modal-box');
let modalReturn=null,modalT;
function openModal(html,label,narrow){
  clearTimeout(modalT);
  modalBox.className='modal'+(narrow?' narrow':'');
  modalBox.setAttribute('aria-label',label);
  modalBox.innerHTML=`<button class="modal-x" type="button" data-act="close-modal" aria-label="Close">${ICON.x}</button>`+html;
  modalBox.scrollTop=0;
  bindAssets(modalBox);
  modalReturn=document.activeElement;
  modal.hidden=false;void modal.offsetWidth;modal.classList.add('open');
  document.body.classList.add('modal-open');
  (modalBox.querySelector('input,textarea')||modalBox.querySelector('.modal-x')).focus({preventScroll:true});
}
function closeModal(){
  if(!modal.classList.contains('open')) return;
  modal.classList.remove('open');document.body.classList.remove('modal-open');
  modalT=setTimeout(()=>{modal.hidden=true;modalBox.innerHTML='';},300);
  if(modalReturn&&document.contains(modalReturn)) modalReturn.focus({preventScroll:true});
}

/* Search lives under the page heading; the header icon opens and closes it */
function setSearch(open,focus=true){
  if(state.page==='chats') return;
  state.searchOpen=open;
  const btn=document.getElementById('search-btn');
  btn.classList.toggle('on',open);btn.setAttribute('aria-expanded',open);
  const wrap=document.getElementById('home-search'); if(!wrap) return;
  wrap.classList.toggle('open',open);
  const input=wrap.querySelector('input');
  input.tabIndex=open?0:-1;
  if(open){if(focus) input.focus({preventScroll:true});return;}
  if(state.q){state.q='';input.value='';renderFeed();}
}
/* On Chats the search lives in the chat box; on a phone with a chat open, go back to the list first */
function toggleSearch(){
  /* The profile has nothing to search, so open the invites search */
  if(state.page==='profile'){state.searchOpen=true;location.hash='#/';return;}
  if(state.page==='chats'){
    if(state.chat&&matchMedia('(max-width:767px)').matches){location.hash='#/chats';setTimeout(()=>document.getElementById('cq').focus());}
    else document.getElementById('cq').focus();
    return;
  }
  setSearch(!state.searchOpen);
}

/* ================= Router ================= */
const view=document.getElementById('view');
function route(){
  const [root,id]=location.hash.replace(/^#\/?/,'').split('/');
  const page=root==='chats'?'chats':root==='profile'?'profile':'invites';
  const changed=page!==state.page;
  /* Switching profile tabs keeps the page where it is, up to the tabs */
  const keep=!changed&&page==='profile'?scrollY:0;
  state.page=page;
  if(page==='profile') state.pfTab=PF_TABS.some(t=>t[0]===id)?id:'overview';
  closeModal();
  state.chat=page==='chats'&&CHATS[id]?id:null;
  if(state.chat){CHATS[state.chat].unread=false;}
  document.body.classList.toggle('chat-page',page==='chats');
  document.body.classList.toggle('chat-open',page==='chats'&&!!state.chat);
  view.innerHTML=page==='chats'?viewChats():page==='profile'?viewProfile():viewInvites();
  if(changed){view.classList.remove('nav-in');void view.offsetWidth;view.classList.add('nav-in');}
  const tabs=document.getElementById('pf-tabs');
  window.scrollTo({top:keep&&tabs?Math.min(keep,tabs.getBoundingClientRect().top+scrollY-parseFloat(getComputedStyle(tabs).top)):0,behavior:'instant'});
  bindAssets(view);
  if(page==='chats'){
    refreshChats();
    document.getElementById('search-btn').classList.remove('on');
    const ta=document.getElementById('cv-text');
    if(ta&&matchMedia('(min-width:768px)').matches) ta.focus({preventScroll:true});
    document.title=(state.chat?byId(state.chat).brand+' — ':'')+'Chats — UGC Platform for Collaborators';
  }else if(page==='profile'){
    document.getElementById('search-btn').classList.remove('on');
    document.title=PROFILE.name+' — Profile — UGC Platform for Collaborators';
  }else{
    renderFeed();
    setSearch(state.searchOpen,!!document.getElementById('q'));
    document.title='Invites — UGC Platform for Collaborators';
  }
  setDrawer(false);
  document.querySelectorAll('#tnav a, #drawer-list a, #top-av-link').forEach(n=>{const on=n.dataset.root===page;n.classList.toggle('active',on);if(on)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
  closePop();
}
window.addEventListener('hashchange',route);

/* ================= Interactions ================= */
const toastEl=document.getElementById('toast'),toastMsg=document.getElementById('toast-msg'),toastUndo=document.getElementById('toast-undo');let toastT,undoFn=null;
function toast(m,undo){
  toastMsg.textContent=m;undoFn=undo||null;toastUndo.hidden=!undo;
  toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.classList.remove('show');undoFn=null;},undo?4000:2200);
}
toastUndo.addEventListener('click',()=>{if(undoFn){undoFn();undoFn=null;}toastEl.classList.remove('show');});
/* Menu: a panel that slides in from the left under the top bar */
const drawer=document.getElementById('drawer');
function setDrawer(open){
  drawer.classList.toggle('open',open);drawer.setAttribute('aria-hidden',!open);
  drawer.querySelectorAll('a').forEach(a=>a.tabIndex=open?0:-1);
  const b=document.getElementById('menu-btn');b.classList.toggle('on',open);b.setAttribute('aria-expanded',open);
  document.body.classList.toggle('drawer-open',open);
}
const pop=document.getElementById('pop-notifs');
function closePop(){pop.classList.remove('open');}
function renderNotifs(){
  const text=n=>n.type==='invite'?`<b>${n.brand}</b><span class="med"> invited you to collaborate</span>`
    :n.type==='reply'?`<span class="med">Check out the </span><b>reply from ${n.brand}</b>`
    :`<span class="med">Invite from </span><b>${n.brand}</b><span class="med"> closes soon</span>`;
  const l=document.getElementById('nt-list');
  l.innerHTML=notifications.map(n=>`<div class="nt-item"${n.chat?` data-go="#/chats/${n.chat}"`:''}><img class="nt-logo" data-a="${n.logo}" alt=""><div class="nt-body"><p class="nt-text">${text(n)}</p><span class="nt-time">${n.time}</span></div></div>`).join('');
  bindAssets(l);
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('#menu-btn')){e.preventDefault();closePop();setDrawer(!drawer.classList.contains('open'));return;}
  if(t.closest('#drawer a')||t.id==='drawer-scrim') setDrawer(false);
  if(t.closest('[data-pop]')){e.preventDefault();setDrawer(false);pop.classList.toggle('open');return;}
  if(pop.classList.contains('open')&&!t.closest('#pop-notifs')) closePop();
  const go=t.closest('[data-go]');
  if(go){closePop();location.hash=go.dataset.go;return;}
  const dec=t.closest('[data-decline]');
  if(dec) return move(dec.dataset.decline,'declined','Invite declined');
  const chat=t.closest('[data-chat]');
  if(chat) return startChat(chat.dataset.chat);
  const file=t.closest('[data-file]');
  if(file){e.preventDefault();return toast(`Downloading ${file.dataset.file}`);}
  const work=t.closest('[data-work]');
  if(work) return openWork(work.dataset.work);
  const filter=t.closest('[data-filter]');
  if(filter){state.pfFilter=filter.dataset.filter;document.getElementById('pf-panel').innerHTML=pfPortfolio();return;}
  const send=t.closest('#cv-send');
  if(send) return sendMsg();
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act);}
});
function doAct(a){
  if(a==='soon') return toast('This screen is next to build');
  if(a==='close-modal') return closeModal();
  if(a==='edit-profile') return openEditProfile();
  if(a==='add-work') return openAddWork();
  if(a==='live') return toast('The live post opens on the platform');
  if(a==='share'){
    const url=location.href.split('#')[0]+'#/profile';
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Profile link copied'),()=>toast('Couldn’t copy the link'));
    return;
  }
  if(a==='clear'){state.q='';const qi=document.getElementById('q');if(qi)qi.value='';return renderFeed();}
}

/* Search filters the invites */
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;renderFeed();}
  if(e.target.id==='cq'){state.cq=e.target.value;renderChatList();}
  if(e.target.id==='cv-text') autosize(e.target);
});
document.addEventListener('keydown',e=>{
  if(modal.classList.contains('open')){if(e.key==='Escape') closeModal();return;}
  if(e.target.id==='cv-text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg();return;}
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.page==='invites'&&state.searchOpen)document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}closePop();if(drawer.classList.contains('open')){setDrawer(false);document.getElementById('menu-btn').focus();}}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
renderNotifs();

route();
setTimeout(()=>{state.loaded=true;renderFeed();},500);
</script>
</body>
